<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ space_name }} – FlaChat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="icon" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="role-creator" class="modal" style="display:none;">
        <div class="modal-box">
            <h3>Crea ruolo: <span id="role-creator-name"></span></h3>
            <label>Scegli un colore</label>
            <input type="color" id="role-color-picker" value="#cccccc">
            <div class="modal-actions">
                <button onclick="confirmRole()">Crea</button>
                <button class="btn-secondary" onclick="closeRoleCreator()">Annulla</button>
            </div>
        </div>
    </div>

    <div id="notif-modal" class="modal" style="display:none;">
        <div class="modal-box">
            <h3>Notifiche</h3>
            <p id="notif-stato"></p>
            <div class="notif-scelte">
                <label><input type="radio" name="lv" value="2"> Tutti i messaggi</label>
                <label><input type="radio" name="lv" value="1"> Solo quando mi menzionano</label>
                <label><input type="radio" name="lv" value="0"> Nessuna notifica</label>
            </div>
            <div class="modal-actions">
                <button id="notif-attiva">Attiva sul dispositivo</button>
                <button class="btn-secondary" onclick="chiudiNotifiche()">Chiudi</button>
            </div>
        </div>
    </div>

    <div id="stanza-modal" class="modal" style="display:none;">
        <div class="modal-box">
            <h3>Impostazioni stanza</h3>
            <p id="stanza-stato"></p>
            <label>Elimina i messaggi più vecchi di</label>
            <div class="retention-scelte">
                <label><input type="radio" name="ret" value=""> Mai</label>
                <label><input type="radio" name="ret" value="7"> 7 giorni</label>
                <label><input type="radio" name="ret" value="30"> 30 giorni</label>
                <label><input type="radio" name="ret" value="90"> 90 giorni</label>
                <label><input type="radio" name="ret" value="365"> 1 anno</label>
                <label><input type="radio" name="ret" value="custom"> Altro</label>
            </div>
            <div id="ret-custom" class="ret-custom" style="display:none;">
                <input type="number" id="ret-giorni" min="1" max="3650"
                       placeholder="giorni">
                <button id="ret-salva">Salva</button>
            </div>
            <p id="ret-avviso" class="ret-avviso"></p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="chiudiStanza()">Chiudi</button>
            </div>
        </div>
    </div>

    <div id="perms-modal" class="modal" style="display:none;">
        <div class="modal-box modal-large">
            <h3>Permessi</h3>

            <div class="perms-tabs">
                <button class="perms-tab active" data-tab="ruoli">Ruoli</button>
                <button class="perms-tab" data-tab="canali">Canali</button>
            </div>

            <div class="perms-sel">
                <select id="perms-ruolo"></select>
                <select id="perms-canale" style="display:none;"></select>
            </div>

            <div id="perms-lista" class="perms-lista"></div>
            <p id="perms-stato" class="perms-stato"></p>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="chiudiPerms()">Chiudi</button>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="channels-sidebar">
            <div class="space-header">
                <div class="space-title">{{ space_name }}</div>
                <div class="space-code">#{{ code }}</div>
            </div>
            <h3>Canali</h3>
            <div id="channel-list"></div>
        </div>

        <div class="chat-container">
            <div class="top-bar">
                <span><strong id="current-channel-label">#general</strong></span>
                <small>
                    <a href="#" id="notif-btn" title="Notifiche">Notifiche</a> ·
                    <a href="#" id="stanza-btn" title="Impostazioni stanza">Stanza</a> ·
                    <a href="/lobby">Stanze</a> · <a href="/logout">Esci</a>
                </small>
            </div>

            <div id="chat-box">
                <div id="ret-banner" class="ret-banner" style="display:none;"></div>
                <div id="load-more" style="display:none;">
                    <button class="btn-link" onclick="loadMore()">Carica messaggi precedenti</button>
                </div>
                <div id="messages"></div>
            </div>

            <div id="stato-connessione" class="stato-connessione" style="display:none;"></div>

            <div id="typing-indicator"></div>

            <div id="mention-box" class="mention-box" style="display:none;"></div>

            <form id="message-form">
                <input type="text" id="message" placeholder="Scrivi un messaggio..." autocomplete="off" required>
                <button type="submit" id="send-button" title="Invia">&#10148;</button>
            </form>
        </div>

        <div class="sidebar">
            <h3>Membri</h3>
            <ul id="user-list"></ul>
        </div>
    </div>

    <script>
    const socket = io();
    const myName = "{{ username }}";
    const code   = "{{ code }}";

    let currentChannel = null;
    let mentionables   = [];   // utenti e ruoli menzionabili
    let channelsData   = [];
    let oldestId       = null;   // cursore per il "carica altri"
    let caricando      = false;

    const box      = document.getElementById('chat-box');
    const msgList  = document.getElementById('messages');
    const loadMoreBtn = document.getElementById('load-more');
    const input    = document.getElementById('message');
    const stato    = document.getElementById('stato-connessione');

    /* =====================================================
       CONNESSIONE E CODA DI INVIO

       Il socket cade spesso (schermo bloccato, wifi che salta,
       il server free che si addormenta). Quando risale ha un sid
       nuovo e il server non sa più in che stanza siamo: prima i
       messaggi partivano nel vuoto senza che nessuno se ne
       accorgesse, e toccava riscriverli.

       Adesso: ogni messaggio resta in coda finché il server non
       conferma di averlo salvato. Se la connessione manca, parte
       da solo appena rientra.
       ===================================================== */

    let joinFatto = false;
    const coda = [];          // messaggi in attesa di conferma
    let contatoreTmp = 0;

    function mostraStato(testo, classe) {
        if (!stato) return;
        stato.textContent = testo || '';
        stato.className = 'stato-connessione' + (classe ? ' ' + classe : '');
        stato.style.display = testo ? 'block' : 'none';
    }

    function faiJoin() {
        socket.emit('join', { code: code, channel_id: currentChannel },
            function (risposta) {
                if (risposta && risposta.ok) {
                    joinFatto = true;
                    mostraStato('');
                    svuotaCoda();
                } else {
                    joinFatto = false;
                    if (risposta && risposta.err === 'sessione') {
                        mostraStato('Sessione scaduta. Ricarica la pagina.', 'ko');
                    }
                }
            });
    }

    socket.on('connect', function () {
        joinFatto = false;
        faiJoin();
    });

    socket.on('disconnect', function () {
        joinFatto = false;
        mostraStato('Connessione persa. Riprovo…', 'ko');
    });

    socket.io.on('reconnect_attempt', function () {
        mostraStato('Riconnessione…', 'ko');
    });

    /* ---------- rendering ---------- */

    /* L'ultimo messaggio disegnato, per capire se il prossimo va
       attaccato allo stesso blocco (stesso autore, entro 5 minuti). */
    let ultimo = null;

    function orario(ts) {
        if (!ts) return '';
        const d = new Date(ts * 1000);
        return String(d.getHours()).padStart(2, '0') + ':'
             + String(d.getMinutes()).padStart(2, '0');
    }

    function stessoBlocco(d, prec) {
        return prec && prec.username === d.username
            && prec.type !== 'system' && d.type !== 'system'
            && Math.abs((d.ts || 0) - (prec.ts || 0)) < 300;
    }

    function nodoMessaggio(d, prec) {
        if (d.type === 'system') {
            const s = document.createElement('div');
            s.className = 'msg-system';
            s.textContent = d.msg;
            return s;
        }

        const riga = document.createElement('div');
        riga.className = 'msg' + (d.own ? ' msg-own' : ' msg-other');
        if (stessoBlocco(d, prec)) riga.classList.add('grouped');
        if (d.mention) riga.classList.add('mentioned');
        if (d.id) riga.dataset.id = d.id;
        if (d.tmp) riga.dataset.tmp = d.tmp;

        const ora = document.createElement('span');
        ora.className = 'msg-time';
        ora.textContent = orario(d.ts);

        const corpo = document.createElement('div');
        corpo.className = 'msg-corpo';

        // textContent, mai innerHTML: il contenuto arriva dagli utenti
        const nome = document.createElement('span');
        nome.className = 'msg-name';
        nome.style.color = d.color;
        nome.textContent = d.username;

        const testo = document.createElement('span');
        testo.className = 'msg-text';
        evidenziaMenzioni(testo, d.msg);

        corpo.appendChild(nome);
        corpo.appendChild(testo);
        riga.appendChild(ora);
        riga.appendChild(corpo);
        return riga;
    }

    /* Spezza il testo sulle @ e crea uno <span> per ognuna.
       Costruito nodo per nodo, mai con innerHTML: il contenuto
       arriva dagli utenti e passerebbe HTML arbitrario. */
    function evidenziaMenzioni(contenitore, testo) {
        const re = /@([\w.\-]+)/g;
        let ultimo = 0, m;

        while ((m = re.exec(testo)) !== null) {
            if (m.index > ultimo) {
                contenitore.appendChild(
                    document.createTextNode(testo.slice(ultimo, m.index)));
            }
            const nome = m[1].toLowerCase();
            const noto = mentionables.some(x => x.nome.toLowerCase() === nome)
                      || ['everyone', 'all', 'tutti', 'here'].includes(nome);

            if (noto) {
                const sp = document.createElement('span');
                sp.className = 'mention';
                if (nome === myName.toLowerCase()) sp.classList.add('mention-me');
                sp.textContent = m[0];
                contenitore.appendChild(sp);
            } else {
                contenitore.appendChild(document.createTextNode(m[0]));
            }
            ultimo = m.index + m[0].length;
        }
        if (ultimo < testo.length) {
            contenitore.appendChild(document.createTextNode(testo.slice(ultimo)));
        }
    }

    function inFondo() {
        return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    }

    function appendi(d) {
        const attaccato = inFondo();
        const nodo = nodoMessaggio(d, ultimo);
        msgList.appendChild(nodo);
        ultimo = d;
        if (attaccato) box.scrollTop = box.scrollHeight;
        return nodo;
    }

    /* ---------- cronologia ---------- */

    async function caricaStorico(channelId, before) {
        if (caricando) return;
        caricando = true;
        try {
            let url = '/api/messages/' + channelId + '?limit=50';
            if (before) url += '&before=' + before;

            const r = await fetch(url);
            if (!r.ok) return;
            const msgs = await r.json();

            if (msgs.length) oldestId = msgs[0].id;
            loadMoreBtn.style.display = (msgs.length === 50) ? 'block' : 'none';

            const frag = document.createDocumentFragment();
            let prec = null;
            msgs.forEach(function (m) {
                frag.appendChild(nodoMessaggio(m, prec));
                prec = m;
            });
            if (!before) ultimo = prec;

            if (before) {
                // inserendo in cima lo scroll salterebbe: lo compensiamo
                const prima = box.scrollHeight;
                msgList.insertBefore(frag, msgList.firstChild);
                box.scrollTop = box.scrollHeight - prima;
            } else {
                msgList.innerHTML = '';
                msgList.appendChild(frag);
                box.scrollTop = box.scrollHeight;
            }
        } finally {
            caricando = false;
        }
    }

    function loadMore() {
        if (currentChannel && oldestId) caricaStorico(currentChannel, oldestId);
    }

    /* ---------- socket ---------- */

    socket.on('message', function (d) {
        if (d.type === 'banned' || d.type === 'kicked') {
            appendi({ type: 'system', msg: d.msg + ' Reindirizzamento...' });
            setTimeout(function () { location.href = '/lobby?banned=1'; }, 1800);
            return;
        }

        // È l'eco di un messaggio nostro: era già a schermo in grigio,
        // lo si conferma sul posto invece di stamparlo una seconda volta.
        if (d.tmp) {
            const v = coda.find(function (x) { return x.tmp === d.tmp; });
            const vecchio = msgList.querySelector('[data-tmp="' + d.tmp + '"]');
            togliDallaCoda(d.tmp);
            if (vecchio) {
                const nuovo = nodoMessaggio(d, null);
                if (vecchio.classList.contains('grouped')) {
                    nuovo.classList.add('grouped');
                }
                vecchio.replaceWith(nuovo);
                ultimo = d;
                if (v) aggiornaStatoCoda();
                return;
            }
        }
        appendi(d);
    });

    socket.on('set_channel', function (d) {
        currentChannel = d.channel_id;
        oldestId = null;
        ultimo = null;
        document.getElementById('current-channel-label').textContent = '#' + d.channel;
        msgList.innerHTML = '';
        caricaStorico(d.channel_id, null);
        aggiornaInput();
        disegnaCanali();
    });

    function aggiornaInput() {
        const ch = channelsData.find(function (c) { return c.id === currentChannel; });
        if (ch && !ch.can_write) {
            input.placeholder = 'Non puoi scrivere in questo canale.';
            input.disabled = true;
        } else {
            input.placeholder = 'Scrivi un messaggio...';
            input.disabled = false;
        }
    }

    function disegnaCanali() {
        const list = document.getElementById('channel-list');
        list.innerHTML = '';
        channelsData.forEach(function (ch) {
            const div = document.createElement('div');
            div.className = 'channel-item' + (ch.id === currentChannel ? ' active' : '');
            if (!ch.can_write) div.classList.add('readonly');

            const nome = document.createElement('span');
            nome.className = 'channel-name';
            nome.textContent = '# ' + ch.name;
            div.appendChild(nome);

            if (ch.unread > 0 && ch.id !== currentChannel) {
                const b = document.createElement('span');
                b.className = 'badge';
                b.textContent = ch.unread > 99 ? '99+' : ch.unread;
                div.appendChild(b);
            }

            div.onclick = function () {
                if (ch.id === currentChannel) return;
                socket.emit('switch_channel', { channel_id: ch.id },
                    function (risposta) {
                        if (risposta && risposta.err === 'nojoin') {
                            joinFatto = false;
                            currentChannel = ch.id;
                            faiJoin();
                        }
                    });
            };
            list.appendChild(div);
        });
    }

    socket.on('update_channels', function (channels) {
        channelsData = channels;
        disegnaCanali();
        aggiornaInput();
    });

    socket.on('update_users', function (users) {
        caricaMentionables();
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        users.forEach(function (u) {
            const li = document.createElement('li');
            if (!u.online) li.classList.add('offline');
            li.style.color = u.color;
            li.title = u.role;
            const n = document.createElement('span');
            n.textContent = u.username;
            li.appendChild(n);
            list.appendChild(li);
        });
    });

    /* ---------- sta scrivendo ---------- */

    let typingTimer = null, isTyping = false;

    input.addEventListener('input', function () {
        if (!isTyping) {
            isTyping = true;
            socket.emit('typing', { typing: true });
        }
        aggiornaMenzioni();
        clearTimeout(typingTimer);
        typingTimer = setTimeout(function () {
            isTyping = false;
            socket.emit('typing', { typing: false });
        }, 900);
    });

    socket.on('typing', function (d) {
        const ind = document.getElementById('typing-indicator');
        if (d.typing) {
            ind.textContent = d.username + ' sta scrivendo...';
            ind.classList.add('visible');
        } else {
            ind.textContent = '';
            ind.classList.remove('visible');
        }
    });

    /* ---------- invio ---------- */

    /* Il menu delle menzioni si chiude e basta: prima questo ramo
       usciva senza inviare, così il primo tap sul pulsante andava
       perso e bisognava premere due volte. */
    document.getElementById('message-form').addEventListener('submit', function (e) {
        e.preventDefault();
        chiudiMenzioni();

        const msg = input.value.trim();
        if (!msg) return;

        input.value = '';
        socket.emit('typing', { typing: false });
        isTyping = false;

        const voce = { tmp: 'tmp' + (++contatoreTmp), msg: msg, nodo: null };
        coda.push(voce);

        // i comandi non tornano indietro come messaggio: niente anteprima
        if (!msg.startsWith('/')) {
            voce.nodo = appendi({
                type: 'chat', own: true, username: myName, msg: msg,
                color: '', ts: Date.now() / 1000, tmp: voce.tmp
            });
            voce.nodo.classList.add('in-attesa');
        }

        inviaVoce(voce);
        aggiornaStatoCoda();
    });

    function togliDallaCoda(tmp) {
        const i = coda.findIndex(function (x) { return x.tmp === tmp; });
        if (i >= 0) coda.splice(i, 1);
    }

    function aggiornaStatoCoda() {
        const fermi = coda.length;
        if (!fermi) {
            if (joinFatto) mostraStato('');
            return;
        }
        mostraStato(fermi === 1 ? 'Un messaggio in attesa di partire.'
                                : fermi + ' messaggi in attesa di partire.', 'attesa');
    }

    function inviaVoce(voce) {
        if (!joinFatto) return;          // parte da sola dopo il join
        voce.partito = Date.now();
        if (voce.nodo) voce.nodo.classList.remove('fallito');

        socket.emit('message', { msg: voce.msg, tmp: voce.tmp },
            function (risposta) {
                if (risposta && risposta.ok) {
                    // i comandi non hanno eco: si chiude qui
                    if (risposta.comando) {
                        togliDallaCoda(voce.tmp);
                        aggiornaStatoCoda();
                    }
                    return;
                }
                if (risposta && risposta.err === 'nojoin') {
                    joinFatto = false;
                    faiJoin();           // rientra e riprova da solo
                    return;
                }
                // rifiutato dal server (permessi, troppo lungo): niente
                // reinvio, il motivo è già comparso in chat
                togliDallaCoda(voce.tmp);
                if (voce.nodo) voce.nodo.remove();
                aggiornaStatoCoda();
            });
    }

    function svuotaCoda() {
        coda.slice().forEach(inviaVoce);
        aggiornaStatoCoda();
    }

    /* Se una conferma non arriva entro dieci secondi il messaggio resta
       in coda e diventa cliccabile per riprovare a mano. Non lo si
       rimanda da soli: potrebbe essere arrivato e sdoppiarsi. */
    setInterval(function () {
        const ora = Date.now();
        coda.forEach(function (v) {
            if (v.partito && ora - v.partito > 10000 && v.nodo
                && !v.nodo.classList.contains('fallito')) {
                v.nodo.classList.add('fallito');
                v.nodo.title = 'Non confermato. Tocca per riprovare.';
                v.nodo.onclick = function () { inviaVoce(v); };
            }
        });
    }, 3000);


    /* =====================================================
       MENZIONI — autocomplete
       ===================================================== */

    const mentionBox = document.getElementById('mention-box');
    let mentionAperto = false, mentionIdx = 0, mentionFiltrati = [];

    function caricaMentionables() {
        return fetch('/api/mentionables/' + code)
            .then(r => r.ok ? r.json() : [])
            .then(d => { mentionables = d; });
    }
    caricaMentionables();

    /* Cerca una @ aperta subito prima del cursore. Si ferma allo
       spazio: "ciao @ma" apre il menu, "ciao @mario " no. */
    function tokenMenzione() {
        const pos = input.selectionStart;
        const prima = input.value.slice(0, pos);
        const m = prima.match(/@([\w.\-]*)$/);
        return m ? { testo: m[1].toLowerCase(), inizio: pos - m[0].length, fine: pos } : null;
    }

    function aggiornaMenzioni() {
        const tok = tokenMenzione();
        if (!tok) return chiudiMenzioni();

        mentionFiltrati = mentionables
            .filter(x => x.nome.toLowerCase().startsWith(tok.testo))
            .slice(0, 8);

        if (!mentionFiltrati.length) return chiudiMenzioni();

        mentionIdx = 0;
        disegnaMenzioni();
        mentionBox.style.display = 'block';
        mentionAperto = true;
    }

    function disegnaMenzioni() {
        mentionBox.innerHTML = '';
        mentionFiltrati.forEach((x, i) => {
            const d = document.createElement('div');
            d.className = 'mention-item' + (i === mentionIdx ? ' active' : '');

            const pallino = document.createElement('span');
            pallino.className = 'mention-dot';
            pallino.style.background = x.colore;

            const nome = document.createElement('span');
            nome.textContent = x.nome;

            const tipo = document.createElement('span');
            tipo.className = 'mention-tipo';
            tipo.textContent = x.desc || x.tipo;

            d.append(pallino, nome, tipo);
            d.onmousedown = e => { e.preventDefault(); scegliMenzione(i); };
            mentionBox.appendChild(d);
        });
    }

    function scegliMenzione(i) {
        const tok = tokenMenzione();
        if (!tok || !mentionFiltrati[i]) return;
        const nome = mentionFiltrati[i].nome;
        input.value = input.value.slice(0, tok.inizio) + '@' + nome + ' '
                    + input.value.slice(tok.fine);
        const pos = tok.inizio + nome.length + 2;
        input.setSelectionRange(pos, pos);
        chiudiMenzioni();
        input.focus();
    }

    function chiudiMenzioni() {
        mentionBox.style.display = 'none';
        mentionAperto = false;
        mentionFiltrati = [];
    }

    input.addEventListener('keydown', e => {
        if (!mentionAperto) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            mentionIdx = (mentionIdx + 1) % mentionFiltrati.length;
            disegnaMenzioni();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            mentionIdx = (mentionIdx - 1 + mentionFiltrati.length) % mentionFiltrati.length;
            disegnaMenzioni();
        } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            scegliMenzione(mentionIdx);
        } else if (e.key === 'Escape') {
            chiudiMenzioni();
        }
    });

    input.addEventListener('blur', () => setTimeout(chiudiMenzioni, 150));

    /* =====================================================
       NOTIFICHE PUSH
       ===================================================== */

    const notifModal = document.getElementById('notif-modal');
    const notifStato = document.getElementById('notif-stato');
    let vapidKey = null;

    document.getElementById('notif-btn').onclick = e => {
        e.preventDefault();
        apriNotifiche();
    };

    function chiudiNotifiche() { notifModal.style.display = 'none'; }

    async function apriNotifiche() {
        notifModal.style.display = 'flex';

        const k = await fetch('/api/push/key').then(r => r.json()).catch(() => ({}));
        vapidKey = k.key;

        if (!k.attive) {
            notifStato.textContent = 'Le notifiche non sono configurate sul server.';
            document.getElementById('notif-attiva').style.display = 'none';
        } else if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            notifStato.textContent = 'Questo browser non supporta le notifiche push.';
            document.getElementById('notif-attiva').style.display = 'none';
        } else if (Notification.permission === 'granted') {
            notifStato.textContent = 'Notifiche attive su questo dispositivo.';
            document.getElementById('notif-attiva').style.display = 'none';
        } else if (Notification.permission === 'denied') {
            notifStato.textContent =
                'Notifiche bloccate: sbloccale dalle impostazioni del browser.';
            document.getElementById('notif-attiva').style.display = 'none';
        } else {
            notifStato.textContent = 'Attiva le notifiche per ricevere gli avvisi.';
            document.getElementById('notif-attiva').style.display = '';
        }

        const p = await fetch('/api/notifications/' + code)
            .then(r => r.json()).catch(() => ({ level: 1 }));
        const radio = document.querySelector(`input[name=lv][value="${p.level}"]`);
        if (radio) radio.checked = true;
    }

    document.querySelectorAll('input[name=lv]').forEach(r => {
        r.onchange = () => {
            fetch('/api/notifications/' + code, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: parseInt(r.value, 10) })
            });
        };
    });

    /* La chiave VAPID viaggia in base64url ma PushManager vuole
       un Uint8Array: va convertita a mano. */
    function chiaveInBytes(base64) {
        const pad = '='.repeat((4 - base64.length % 4) % 4);
        const b64 = (base64 + pad).replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(b64);
        return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    document.getElementById('notif-attiva').onclick = async () => {
        try {
            const perm = await Notification.requestPermission();
            if (perm !== 'granted') {
                notifStato.textContent = 'Permesso negato.';
                return;
            }
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;

            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: chiaveInBytes(vapidKey)
            });

            const r = await fetch('/api/push/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sub)
            });

            notifStato.textContent = r.ok
                ? 'Notifiche attive su questo dispositivo.'
                : 'Iscrizione non riuscita, riprova.';
            if (r.ok) document.getElementById('notif-attiva').style.display = 'none';
        } catch (err) {
            notifStato.textContent = 'Errore: ' + err.message;
        }
    };

    /* Se il permesso c'è già, riallinea l'iscrizione in silenzio:
       gli endpoint scadono e vanno rinnovati. */
    if ('serviceWorker' in navigator && Notification.permission === 'granted') {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => reg.pushManager.getSubscription())
            .then(sub => {
                if (sub) {
                    fetch('/api/push/subscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sub)
                    });
                }
            })
            .catch(() => {});
    }


    /* =====================================================
       IMPOSTAZIONI STANZA — scadenza messaggi
       ===================================================== */

    const stanzaModal = document.getElementById('stanza-modal');
    const retBanner   = document.getElementById('ret-banner');

    document.getElementById('stanza-btn').onclick = e => {
        e.preventDefault();
        apriStanza();
    };

    function chiudiStanza() { stanzaModal.style.display = 'none'; }

    function testoScadenza(g) {
        if (!g) return null;
        if (g === 1) return 'I messaggi vengono eliminati dopo 1 giorno.';
        if (g === 365) return 'I messaggi vengono eliminati dopo 1 anno.';
        return `I messaggi vengono eliminati dopo ${g} giorni.`;
    }

    async function caricaRetention() {
        const d = await fetch('/api/retention/' + code)
            .then(r => r.ok ? r.json() : null).catch(() => null);
        if (!d) return null;

        const t = testoScadenza(d.giorni);
        if (t) {
            retBanner.textContent = t;
            retBanner.style.display = 'block';
        } else {
            retBanner.style.display = 'none';
        }
        return d;
    }

    caricaRetention();

    async function apriStanza() {
        stanzaModal.style.display = 'flex';
        const d = await caricaRetention();
        if (!d) return;

        const predefiniti = ['', '7', '30', '90', '365'];
        const val = d.giorni ? String(d.giorni) : '';
        const custom = document.getElementById('ret-custom');

        if (predefiniti.includes(val)) {
            const r = document.querySelector(`input[name=ret][value="${val}"]`);
            if (r) r.checked = true;
            custom.style.display = 'none';
        } else {
            // valore fuori dai predefiniti: mostra "Altro" col numero dentro
            document.querySelector('input[name=ret][value="custom"]').checked = true;
            document.getElementById('ret-giorni').value = val;
            custom.style.display = d.owner ? 'flex' : 'none';
        }

        document.querySelectorAll('input[name=ret]').forEach(x => {
            x.disabled = !d.owner;
        });
        document.getElementById('ret-giorni').disabled = !d.owner;
        document.getElementById('ret-salva').disabled = !d.owner;

        document.getElementById('stanza-stato').textContent = d.owner
            ? 'Sei il proprietario di questa stanza.'
            : 'Solo il proprietario può cambiare la scadenza.';

        const av = document.getElementById('ret-avviso');
        av.textContent = d.da_eliminare
            ? `${d.da_eliminare} messaggi verranno eliminati alla prossima pulizia.`
            : '';
    }

    document.querySelectorAll('input[name=ret]').forEach(r => {
        r.onchange = async () => {
            if (r.value === 'custom') {
                // non salva: apre il campo e aspetta il numero
                document.getElementById('ret-custom').style.display = 'flex';
                document.getElementById('ret-giorni').focus();
                return;
            }
            document.getElementById('ret-custom').style.display = 'none';
            /* Impostare una scadenza distrugge cronologia: salvaRetention
               chiede conferma. Toglierla non distrugge nulla. */
            await salvaRetention(r.value === '' ? null : parseInt(r.value, 10));
        };
    });

    async function salvaRetention(g) {
        if (g !== null) {
            const ok = confirm(
                `I messaggi più vecchi di ${g} giorni verranno eliminati ` +
                `definitivamente, e la stessa regola varrà d'ora in poi.\n\n` +
                `Confermi?`);
            if (!ok) { await apriStanza(); return; }
        }
        const res = await fetch('/api/retention/' + code, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ giorni: g })
        }).then(x => x.json()).catch(() => ({ ok: false }));

        if (!res.ok) {
            document.getElementById('stanza-stato').textContent =
                res.errore || 'Modifica non riuscita.';
        }
        await apriStanza();
    }

    document.getElementById('ret-salva').onclick = () => {
        const v = parseInt(document.getElementById('ret-giorni').value, 10);
        const av = document.getElementById('ret-avviso');
        if (!v || v < 1 || v > 3650) {
            av.textContent = 'Inserisci un numero fra 1 e 3650.';
            return;
        }
        salvaRetention(v);
    };

    document.getElementById('ret-giorni').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('ret-salva').click();
        }
    });


    /* =====================================================
       PANNELLO PERMESSI  (/perms)
       ===================================================== */

    const permsModal = document.getElementById('perms-modal');
    let permsDati = null;
    let permsTab = 'ruoli';

    socket.on('open_perms', () => apriPerms());

    function chiudiPerms() { permsModal.style.display = 'none'; }

    async function apriPerms() {
        permsModal.style.display = 'flex';
        permsDati = await fetch('/api/perms/' + code)
            .then(r => r.ok ? r.json() : null).catch(() => null);
        if (!permsDati) {
            document.getElementById('perms-stato').textContent =
                'Impossibile caricare i permessi.';
            return;
        }

        const selR = document.getElementById('perms-ruolo');
        selR.innerHTML = '';
        permsDati.ruoli.forEach(r => {
            const o = document.createElement('option');
            o.value = r.id;
            o.textContent = r.nome + (r.modificabile ? '' : ' (bloccato)');
            selR.appendChild(o);
        });

        const selC = document.getElementById('perms-canale');
        selC.innerHTML = '';
        permsDati.canali.forEach(c => {
            const o = document.createElement('option');
            o.value = c.id;
            o.textContent = '# ' + c.nome;
            selC.appendChild(o);
        });
        if (currentChannel) selC.value = currentChannel;

        disegnaPerms();
    }

    document.querySelectorAll('.perms-tab').forEach(t => {
        t.onclick = () => {
            permsTab = t.dataset.tab;
            document.querySelectorAll('.perms-tab').forEach(
                x => x.classList.toggle('active', x === t));
            document.getElementById('perms-canale').style.display =
                permsTab === 'canali' ? '' : 'none';
            disegnaPerms();
        };
    });

    document.getElementById('perms-ruolo').onchange = disegnaPerms;
    document.getElementById('perms-canale').onchange = disegnaPerms;

    function ruoloScelto() {
        const id = parseInt(document.getElementById('perms-ruolo').value, 10);
        return permsDati.ruoli.find(r => r.id === id);
    }

    function disegnaPerms() {
        const lista = document.getElementById('perms-lista');
        const stato = document.getElementById('perms-stato');
        lista.innerHTML = '';
        stato.textContent = '';

        const ruolo = ruoloScelto();
        if (!ruolo) return;

        if (!ruolo.modificabile) {
            stato.textContent = 'Questo ruolo è pari o superiore al tuo: '
                              + 'puoi vederlo ma non modificarlo.';
        }

        if (permsTab === 'ruoli') {
            if (!permsDati.posso_ruoli) {
                stato.textContent = 'Ti serve il permesso "Gestire i ruoli".';
            }
            permsDati.permessi_ruolo.forEach(p => {
                const attivo = (ruolo.permessi & p.bit) !== 0;
                /* non puoi concedere un permesso che non hai:
                   il server lo rifiuterebbe comunque */
                const tuoi = (permsDati.miei_permessi & p.bit) !== 0;
                const bloccato = !ruolo.modificabile || !permsDati.posso_ruoli
                              || (!tuoi && !attivo);

                lista.appendChild(rigaSwitch(p.nome, attivo, bloccato, val => {
                    const nuovo = val ? (ruolo.permessi | p.bit)
                                      : (ruolo.permessi & ~p.bit);
                    salvaRuolo(ruolo, nuovo);
                }));
            });
        } else {
            if (!permsDati.posso_canali) {
                stato.textContent = 'Ti serve il permesso "Gestire i canali".';
            }
            const chId = parseInt(document.getElementById('perms-canale').value, 10);
            const ov = permsDati.override[chId + ':' + ruolo.id] || {allow: 0, deny: 0};

            permsDati.permessi_canale.forEach(p => {
                let stato3 = 0;
                if (ov.allow & p.bit) stato3 = 1;
                else if (ov.deny & p.bit) stato3 = -1;

                const eredita = (ruolo.permessi & p.bit) !== 0;
                const bloccato = !ruolo.modificabile || !permsDati.posso_canali;

                lista.appendChild(rigaTreStati(p.nome, stato3, eredita, bloccato,
                    val => salvaOverride(chId, ruolo.id, p.bit, val)));
            });
        }
    }

    function rigaSwitch(nome, attivo, bloccato, onChange) {
        const riga = document.createElement('div');
        riga.className = 'perm-riga';

        const et = document.createElement('span');
        et.className = 'perm-nome';
        et.textContent = nome;

        const btn = document.createElement('button');
        btn.className = 'perm-switch' + (attivo ? ' on' : '');
        btn.textContent = attivo ? 'Sì' : 'No';
        btn.disabled = bloccato;
        btn.onclick = () => onChange(!attivo);

        riga.append(et, btn);
        return riga;
    }

    /* Tre stati: consenti / eredita / nega.
       "Eredita" non è "no": se domani cambi il ruolo, l'ereditato segue,
       il negato resta negato. */
    function rigaTreStati(nome, stato, eredita, bloccato, onChange) {
        const riga = document.createElement('div');
        riga.className = 'perm-riga';

        const et = document.createElement('span');
        et.className = 'perm-nome';
        et.textContent = nome;

        const gruppo = document.createElement('div');
        gruppo.className = 'perm-tre';

        [[1, '✓', 'Consentito'],
         [0, '–', eredita ? 'Eredita (sì)' : 'Eredita (no)'],
         [-1, '✗', 'Negato']].forEach(([v, simbolo, titolo]) => {
            const b = document.createElement('button');
            b.className = 'perm-btn' + (stato === v ? ' active s' + (v + 1) : '');
            b.textContent = simbolo;
            b.title = titolo;
            b.disabled = bloccato;
            b.onclick = () => onChange(v);
            gruppo.appendChild(b);
        });

        riga.append(et, gruppo);
        return riga;
    }

    async function salvaRuolo(ruolo, nuoviPermessi) {
        const r = await fetch('/api/perms/' + code + '/role', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({role_id: ruolo.id, permessi: nuoviPermessi})
        }).then(x => x.json()).catch(() => ({ok: false}));

        if (r.ok) {
            ruolo.permessi = nuoviPermessi;
            disegnaPerms();
        } else {
            document.getElementById('perms-stato').textContent =
                r.errore || 'Modifica non riuscita.';
        }
    }

    async function salvaOverride(chId, roleId, bit, stato) {
        const r = await fetch('/api/perms/' + code + '/override', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({channel_id: chId, role_id: roleId,
                                  bit: bit, stato: stato})
        }).then(x => x.json()).catch(() => ({ok: false}));

        if (r.ok) {
            permsDati.override[chId + ':' + roleId] = {allow: r.allow, deny: r.deny};
            disegnaPerms();
        } else {
            document.getElementById('perms-stato').textContent =
                r.errore || 'Modifica non riuscita.';
        }
    }

    /* ---------- creazione ruolo ---------- */




    let pendingRoleName = null;

    socket.on('open_role_creator', function (d) {
        pendingRoleName = d.role_name;
        document.getElementById('role-creator-name').textContent = d.role_name;
        document.getElementById('role-creator').style.display = 'flex';
    });

    function confirmRole() {
        if (!pendingRoleName) return;
        socket.emit('create_role', {
            role_name: pendingRoleName,
            color: document.getElementById('role-color-picker').value
        });
        closeRoleCreator();
    }

    function closeRoleCreator() {
        document.getElementById('role-creator').style.display = 'none';
        pendingRoleName = null;
    }
    </script>
</body>
