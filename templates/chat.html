<html>
<head>
    <title>FlaChat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<style>
.wrapper {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) 190px;
    gap: 14px;
    width: min(96vw, 1180px);
    height: min(86vh, 780px);
}

.channels-sidebar,
.chat-container,
.sidebar {
    border: 1px solid rgba(49, 230, 189, 0.22);
    border-radius: 8px;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
        rgba(5, 18, 26, 0.78);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 20px 60px rgba(0,0,0,0.34),
        0 0 30px rgba(49,230,189,0.08);
    backdrop-filter: blur(18px);
}

.channels-sidebar,
.sidebar {
    padding: 14px;
    overflow: auto;
}

.channels-sidebar h3,
.sidebar h3 {
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    color: rgba(244,251,255,0.9);
    font-size: 0.86rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.channel-item {
    margin-bottom: 7px;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    color: rgba(244,251,255,0.68);
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    transition: 0.18s ease;
}

.channel-item:hover {
    color: white;
    border-color: rgba(49,230,189,0.28);
    background: rgba(49,230,189,0.1);
}

.channel-item.active {
    color: #eafffb;
    border-color: rgba(49,230,189,0.75);
    background:
        linear-gradient(135deg, rgba(49,230,189,0.22), rgba(106,168,255,0.18));
    box-shadow: 0 0 18px rgba(49,230,189,0.18);
    font-weight: 800;
}

.channel-item.readonly {
    opacity: 0.48;
}

.chat-container {
    min-width: 0;
    padding: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 15px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.045);
}

.top-bar span {
    min-width: 0;
    color: rgba(244,251,255,0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.top-bar strong {
    color: #31e6bd;
}

.top-bar small {
    flex-shrink: 0;
}

.top-bar small a {
    color: rgba(244,251,255,0.7);
    font-size: 0.82rem;
    text-decoration: none;
}

.top-bar small a:hover {
    color: #31e6bd;
}

#current-channel-label {
    color: #6aa8ff;
    font-weight: 800;
}

#chat-box {
    min-height: 0;
    max-height: none;
    margin: 0;
    padding: 18px;
    overflow-y: auto;
    text-align: left;
}

#chat-box::-webkit-scrollbar,
.channels-sidebar::-webkit-scrollbar,
.sidebar::-webkit-scrollbar {
    width: 8px;
}

#chat-box::-webkit-scrollbar-thumb,
.channels-sidebar::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb {
    border-radius: 8px;
    background: rgba(49,230,189,0.26);
}

#chat-box p {
    width: fit-content;
    max-width: min(78%, 620px);
    margin: 0 0 10px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: rgba(244,251,255,0.92);
    background: rgba(255,255,255,0.075);
    line-height: 1.38;
    box-shadow: 0 8px 18px rgba(0,0,0,0.14);
}

#user-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

#user-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    margin-bottom: 7px;
    padding: 7px 9px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    font-size: 0.88rem;
}

#user-list li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #31e6bd;
    box-shadow: 0 0 12px rgba(49,230,189,0.9);
    flex-shrink: 0;
}

#message-form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
    background: rgba(3, 13, 19, 0.72);
}

#message-form input {
    flex: 1;
    display: block;
    width: auto;
    height: 46px;
    margin: 0;
    padding: 0 15px;
    border-radius: 8px;
    border: 1px solid rgba(49,230,189,0.28);
    background: rgba(3,16,22,0.82);
    color: white;
    -webkit-text-fill-color: white;
}

#message-form input:focus {
    border-color: rgba(49,230,189,0.95);
    box-shadow: 0 0 0 4px rgba(49,230,189,0.13);
}

#send-button {
    flex: 0 0 48px;
    width: 48px;
    height: 46px;
    min-width: 48px;
    min-height: 46px;
    margin: 0;
    padding: 0;
    border-radius: 8px;
    border: 1px solid rgba(49,230,189,0.7);
    color: #dffff7;
    background:
        linear-gradient(135deg, rgba(49,230,189,0.28), rgba(106,168,255,0.26)),
        rgba(4,18,26,0.96);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.07) inset,
        0 0 22px rgba(49,230,189,0.32),
        0 12px 24px rgba(0,0,0,0.3);
}

#send-button span {
    display: block;
    transform: translateX(1px);
    font-size: 1.15rem;
}

#send-button:hover {
    transform: translateY(-1px);
    border-color: rgba(49,230,189,1);
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.12) inset,
        0 0 32px rgba(49,230,189,0.46),
        0 16px 30px rgba(0,0,0,0.36);
}

#send-button:active {
    transform: translateY(1px) scale(0.98);
}

@media (max-width: 860px) {
    body {
        align-items: stretch;
        padding: 10px;
    }

    .wrapper {
        width: 100%;
        height: calc(100vh - 20px);
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .channels-sidebar,
    .sidebar {
        max-height: 128px;
    }

    .chat-container {
        min-height: 360px;
    }

    #chat-box p {
        max-width: 88%;
    }

    .top-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
    }
}

#chat-box .msg-own {
    margin-left: auto;
    margin-right: 0;
    color: #04191f;
    background: linear-gradient(135deg, #31e6bd, #6aa8ff);
    border: 1px solid rgba(49,230,189,0.45);
}

#chat-box .msg-other {
    margin-left: 0;
    margin-right: auto;
    color: rgba(244,251,255,0.94);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
}

#chat-box .msg-system {
    margin-left: auto;
    margin-right: auto;
    max-width: 90%;
    color: rgba(244,251,255,0.68);
    text-align: center;
    font-style: italic;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.08);
}

#chat-box .msg-name {
    display: block;
    margin-bottom: 3px;
    font-size: 0.78rem;
    font-weight: 800;
}

#typing-indicator {
    min-height: 24px;
    padding: 0 16px 8px;
    color: rgba(49,230,189,0.95);
    font-size: 0.86rem;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.18s;
}

#typing-indicator.visible {
    opacity: 1;
}
</style>
<body>

    <!-- Pannello creazione ruolo -->
    <div id="role-creator" style="display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:999;">
        <div style="background:rgba(40,40,40,0.97); border:2px solid white;
            border-radius:12px; padding:30px; text-align:center; min-width:280px;">
            <h3 style="margin-bottom:16px;">Crea ruolo: <span id="role-creator-name" style="color:#aef;"></span></h3>
            <label style="display:block; margin-bottom:8px; opacity:0.8;">Scegli un colore</label>
            <input type="color" id="role-color-picker" value="#ffffff"
                style="width:80px; height:80px; border:none; border-radius:50%;
                cursor:pointer; background:none; padding:0;">
            <br><br>
            <div style="display:flex; gap:12px; justify-content:center;">
                <button onclick="confirmRole()">✅ Crea</button>
                <button onclick="closeRoleCreator()">❌ Annulla</button>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <!-- Canali -->
        <div class="channels-sidebar">
            <h3>📢 Canali</h3>
            <div id="channel-list"></div>
        </div>

        <!-- Chat -->
        <div class="chat-container">
            <div class="top-bar">
                <span>
                    Stanza <strong>#{{ room }}</strong> —
                    <span id="current-channel-label">#general</span> —
                    <strong>{{ username }}</strong>
                </span>
                <small><a href="/logout">Esci</a> | <a href="/lobby">Cambia stanza</a></small>
            </div>
            <div id="chat-box"></div>

            <div id="typing-indicator"></div>

            <form id="message-form">
                <input type="text" id="message" placeholder="Scrivi un messaggio..." autocomplete="off" required>
                <button type="submit" id="send-button" title="Invia">
                    <span>➤</span>
                </button>
            </form>
        </div>

        <!-- Utenti -->
        <div class="sidebar">
            <h3>🟢 Online</h3>
            <ul id="user-list"></ul>
        </div>
    </div>

    <script>
        const socket = io();
        const username = "{{ username }}";
        const room = "{{ room }}";
        let currentChannel = "general";
        let channelsData = [];

        socket.emit('join', { username, room });

        // Messaggi
        socket.on('message', data => {
            const box = document.getElementById('chat-box');
            const p = document.createElement('p');

            if (data.type === "banned") {
                p.className = "msg-system";
                p.textContent = "Sei stato bannato. Reindirizzamento in corso...";
                box.appendChild(p);
                setTimeout(() => { window.location.href = "/lobby?banned=1"; }, 2000);
                return;
            }

            if (data.type === "chat") {
                p.className = data.username === username ? "msg-own" : "msg-other";

                const name = document.createElement('span');
                name.className = "msg-name";
                name.style.color = data.color;
                name.textContent = data.username;

                const text = document.createElement('span');
                text.textContent = data.msg;

                p.appendChild(name);
                p.appendChild(document.createTextNode(": "));
                p.appendChild(text);
            }

            if (data.type === "system") {
                p.className = "msg-system";
                p.textContent = data.msg;
            }

            box.appendChild(p);
            box.scrollTop = box.scrollHeight;
        });

        let typingTimer = null;
        let isTyping = false;

        const messageInput = document.getElementById('message');

        messageInput.addEventListener('input', () => {
            if (!isTyping) {
                isTyping = true;
                socket.emit('typing', {
                    username,
                    room,
                    channel: currentChannel,
                    typing: true
                });
            }

            clearTimeout(typingTimer);

            typingTimer = setTimeout(() => {
                isTyping = false;
                socket.emit('typing', {
                    username,
                    room,
                    channel: currentChannel,
                    typing: false
                });
            }, 900);
        });

        socket.on('typing', data => {
            const indicator = document.getElementById('typing-indicator');

            if (data.typing) {
                indicator.textContent = `${data.username} sta scrivendo...`;
                indicator.classList.add('visible');
            } else {
                indicator.textContent = "";
                indicator.classList.remove('visible');
            }
        });

        // Utenti
        socket.on('update_users', users => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            users.forEach(u => {
                const li = document.createElement('li');
                let icon = "";
                if (u.role === "owner") icon = "👑";
                if (u.role === "admin") icon = "🛡️";
                if (u.role === "mod") icon = "🔧";
                li.style.color = u.color;
                li.textContent = `${icon} ${u.username}`;
                list.appendChild(li);
            });
        });

        // Canali
        socket.on('update_channels', channels => {
            channelsData = channels;
            const list = document.getElementById('channel-list');
            list.innerHTML = '';
            channels.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item' + (ch.name === currentChannel ? ' active' : '');
                const canWrite = ch.write.includes('all');
                if (!canWrite) div.classList.add('readonly');
                div.textContent = `# ${ch.name}`;
                div.onclick = () => switchChannel(ch.name);
                list.appendChild(div);
            });
        });

        // Cambio canale dal server
        socket.on('set_channel', data => {
            currentChannel = data.channel;
            document.getElementById('current-channel-label').textContent = `#${data.channel}`;
            document.getElementById('chat-box').innerHTML = '';
            // aggiorna active
            document.querySelectorAll('.channel-item').forEach(el => {
                el.classList.toggle('active', el.textContent.trim() === `# ${data.channel}`);
            });
            // aggiorna placeholder input
            const ch = channelsData.find(c => c.name === data.channel);
            const input = document.getElementById('message');
            if (ch && !ch.write.includes('all')) {
                input.placeholder = 'Non puoi scrivere in questo canale.';
                input.disabled = true;
            } else {
                input.placeholder = 'Scrivi un messaggio...';
                input.disabled = false;
            }
        });

        function switchChannel(chName) {
            if (chName === currentChannel) return;
            socket.emit('switch_channel', { room, channel: chName });
        }

        // Invio messaggio
        document.getElementById('message-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('message');
            const msg = input.value.trim();

            if (msg !== "") {
                socket.emit('message', { username, room, msg });
                socket.emit('typing', {
                    username,
                    room,
                    channel: currentChannel,
                    typing: false
                });
                isTyping = false;
                input.value = "";
            }
        });

        // Ruota colori
        let pendingRoleName = null;

        socket.on('open_role_creator', data => {
            pendingRoleName = data.role_name;
            document.getElementById('role-creator-name').textContent = data.role_name;
            document.getElementById('role-color-picker').value = '#ffffff';
            document.getElementById('role-creator').style.display = 'flex';
        });

        function confirmRole() {
            if (!pendingRoleName) return;
            const color = document.getElementById('role-color-picker').value;
            socket.emit('create_role', { room, role_name: pendingRoleName, color });
            closeRoleCreator();
        }

        function closeRoleCreator() {
            document.getElementById('role-creator').style.display = 'none';
            pendingRoleName = null;
        }
    </script>
</body>
</html>
